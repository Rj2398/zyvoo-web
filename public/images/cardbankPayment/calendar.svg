<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Outer calendar -->
  <rect x="3" y="5" width="18" height="16" rx="2" stroke="rgb(74, 234, 177)" stroke-width="2"></rect>
  <line x1="3" y1="9" x2="21" y2="9" stroke="rgb(74, 234, 177)" stroke-width="2"></line>
  <line x1="8" y1="3" x2="8" y2="7" stroke="rgb(74, 234, 177)" stroke-width="2" stroke-linecap="round"></line>
  <line x1="16" y1="3" x2="16" y2="7" stroke="rgb(74, 234, 177)" stroke-width="2" stroke-linecap="round"></line>

  <!-- 9 dots (3×3 grid) -->
  <!-- Row 1 -->
  <circle cx="9" cy="13" r="1.3" fill="rgb(74, 234, 177)"></circle>
  <circle cx="12" cy="13" r="1.3" fill="rgb(74, 234, 177)"></circle>
  <circle cx="15" cy="13" r="1.3" fill="rgb(74, 234, 177)"></circle>

  <!-- Row 2 -->
  <circle cx="9" cy="16" r="1.3" fill="rgb(74, 234, 177)"></circle>
  <circle cx="12" cy="16" r="1.3" fill="rgb(74, 234, 177)"></circle>
  <circle cx="15" cy="16" r="1.3" fill="rgb(74, 234, 177)"></circle>

  <!-- Row 3 -->
  <circle cx="9" cy="19" r="1.3" fill="rgb(74, 234, 177)"></circle>
  <circle cx="12" cy="19" r="1.3" fill="rgb(74, 234, 177)"></circle>
  <circle cx="15" cy="19" r="1.3" fill="rgb(74, 234, 177)"></circle>

</svg>
